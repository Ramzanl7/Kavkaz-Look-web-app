# Kavkaz Look на российской площадке: раздаём приложение и пробрасываем запросы к базе Supabase.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # DNS для обращения к Supabase (Яндекс и Google) — адрес перепроверяется каждые 5 минут
  resolver 77.88.8.8 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 5s;

  # Роботы мессенджеров (WhatsApp, Telegram, VK…) получают страницу с превью
  map $http_user_agent $is_bot {
    default 0;
    "~*(WhatsApp|TelegramBot|facebookexternalhit|Facebot|Twitterbot|vkShare|Slackbot|Discordbot|LinkedInBot|SkypeUriPreview|Viber|YandexBot|Googlebot|bingbot|Applebot|Pinterest|redditbot|Iframely|OdklBot|Mail\.RU_Bot)" 1;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

  server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    include /etc/nginx/security-headers.conf;

    # Прокладка к Supabase: браузер обращается к нашему серверу в России, сервер — к базе
    location /sb/ {
      set $sb __SUPABASE_HOST__;
      rewrite ^/sb/(.*)$ /$1 break;
      proxy_pass https://$sb;
      proxy_ssl_server_name on;
      proxy_ssl_name $sb;
      proxy_set_header Host $sb;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # Файлы сборки с хешем в имени — кэш на год
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }
    location = /version.json {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }
    location = /sw.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    # Превью для роботов — небольшой сервер внутри контейнера
    location = /__share {
      internal;
      proxy_pass http://127.0.0.1:3001;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    # Все остальные адреса — приложение (одна страница); роботам — превью
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      if ($is_bot) { rewrite ^ /__share last; }
      try_files $uri /index.html;
    }
  }
}
