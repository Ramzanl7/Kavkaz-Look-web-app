<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kavkaz Look" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Соединение с базой начинаем открывать сразу, не дожидаясь загрузки скриптов -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>html,body{background:#061914;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
      /* Заставка до загрузки скриптов: React заменит её, когда приложение будет готово */
      .boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;font-family:system-ui,sans-serif;color:#F4E7C0}
      .boot-k{width:88px;height:88px;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
      .boot-name{font-weight:700;font-size:1.25rem}.boot-name b{color:#D6B56A}
      .boot-bar{width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#D6B56A,transparent);background-size:200% 100%;animation:boot 1.2s linear infinite}
      @keyframes boot{from{background-position:100% 0}to{background-position:-100% 0}}
      @media (prefers-reduced-motion:reduce){.boot-bar{animation:none}}
      .boot-help{max-width:300px;text-align:center;display:grid;gap:8px;margin-top:10px}.boot-help p{margin:0}.boot-sub{font-size:.875rem;opacity:.75}.boot-help button{justify-self:center;margin-top:6px;padding:12px 28px;border:0;border-radius:14px;background:#D6B56A;color:#1a1406;font:inherit;font-weight:700}
    </style>
    <title>Kavkaz Look — одежда бутиков Грозного и Чечни</title>
    <!--og-->
    <meta name="description" content="Вся одежда Грозного — в одном приложении. Доставка, самовывоз или примерка в бутике. Оплата при получении." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kavkaz Look" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Kavkaz Look — одежда бутиков Грозного и Чечни" />
    <meta property="og:description" content="Вся одежда Грозного — в одном приложении. Доставка, самовывоз или примерка в бутике. Оплата при получении." />
    <meta property="og:image" content="https://kavkaz-look.vercel.app/og/default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/og-->
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Загрузка Kavkaz Look"><img class="boot-k" src="/favicon.svg" width="88" height="88" alt="" /><span class="boot-name">Kavkaz <b>Look</b></span><i class="boot-bar"></i></div></div>
    <script src="/boot.js" async></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
